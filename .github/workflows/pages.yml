name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Fetch Git LFS assets
        run: git lfs pull
      - name: Verify review video assets
        run: |
          node -e "const fs=require('node:fs'); const dir='video/reviews'; const files=fs.readdirSync(dir).filter(file=>file.endsWith('.mp4')); if (!files.length || files.some(file => { const data=fs.readFileSync(dir+'/'+file); return data.length < 8 || data.toString('ascii',4,8) !== 'ftyp'; })) throw new Error('Review videos are not hydrated from Git LFS.');"
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
