<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="160" height="170" fill="none">
  <!-- Travelers' Choice Text -->
  <text x="80" y="24" text-anchor="middle" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.02em">Travelers'</text>
  <text x="80" y="38" text-anchor="middle" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.02em">Choice<tspan font-size="9" dy="-5">™</tspan></text>
  
  <!-- Laurel Wreath & Center Owl -->
  <g transform="translate(80, 85)">
    <!-- Tripadvisor Owl -->
    <path d="M-13 -13 C-9 -17 9 -17 13 -13 C15 -10 16 -5 16 0 C16 11 0 16 0 16 C0 16 -16 11 -16 0 C-16 -5 -15 -10 -13 -13 Z" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <!-- Left eye -->
    <circle cx="-6.5" cy="-2" r="5" fill="#FFFFFF"/>
    <circle cx="-6.5" cy="-2" r="2.2" fill="#00345D"/>
    <!-- Right eye -->
    <circle cx="6.5" cy="-2" r="5" fill="#FFFFFF"/>
    <circle cx="6.5" cy="-2" r="2.2" fill="#00345D"/>
    <!-- Beak -->
    <polygon points="0,0 2.2,-3 -2.2,-3" fill="#FFFFFF"/>
    <polygon points="0,3 1.8,0 -1.8,0" fill="#FFFFFF"/>
    
    <!-- Left Wreath Leaves -->
    <path d="M-22 18 C-32 8 -34 -8 -26 -22" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-26 -22 C-29 -20 -33 -17 -34 -12 C-32 -13 -28 -14 -26 -16" fill="#FFFFFF"/>
    <path d="M-28 -14 C-33 -11 -37 -6 -36 0 C-34 -2 -30 -4 -28 -7" fill="#FFFFFF"/>
    <path d="M-29 -4 C-35 -1 -38 6 -36 12 C-34 9 -31 6 -29 3" fill="#FFFFFF"/>
    <path d="M-28 6 C-33 11 -35 18 -32 24 C-31 20 -28 17 -27 13" fill="#FFFFFF"/>
    <path d="M-22 18 C-26 23 -27 30 -23 35 C-23 31 -21 27 -20 23" fill="#FFFFFF"/>

    <!-- Right Wreath Leaves -->
    <path d="M22 18 C32 8 34 -8 26 -22" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M26 -22 C29 -20 33 -17 34 -12 C32 -13 28 -14 26 -16" fill="#FFFFFF"/>
    <path d="M28 -14 C33 -11 37 -6 36 0 C34 -2 30 -4 28 -7" fill="#FFFFFF"/>
    <path d="M29 -4 C35 -1 38 6 36 12 C34 9 31 6 29 3" fill="#FFFFFF"/>
    <path d="M28 6 C33 11 35 18 32 24 C31 20 28 17 27 13" fill="#FFFFFF"/>
    <path d="M22 18 C26 23 27 30 23 35 C23 31 21 27 20 23" fill="#FFFFFF"/>
  </g>

  <!-- Year: 2026 -->
  <text x="80" y="138" text-anchor="middle" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="0.05em">2026</text>
  
  <!-- Best of the Best -->
  <text x="80" y="154" text-anchor="middle" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.02em">Best of the Best</text>
</svg>
